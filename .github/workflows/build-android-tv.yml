name: Build CustomLauncher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'customlauncher/**'
      - '.github/workflows/build-android-tv.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: customlauncher
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomLauncher-AndroidTV-FireTV-debug
          path: customlauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
